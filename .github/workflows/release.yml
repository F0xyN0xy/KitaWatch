name: Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3-dev

      - name: Install frontend deps
        run: npm install

      - name: Fetch Kuhi API (vendored fork)
        run: npm run setup:api

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install pyinstaller
          python -m pip install -r api/anime-api/requirements.txt
          python -m pip install -r proxy/requirements.txt

      - name: Write bundled .env from secrets
        shell: bash
        run: |
          printf 'ANILIST_CLIENT_ID=%s\nANILIST_CLIENT_SECRET=%s\nANILIST_REDIRECT_URI=kitawatch://auth\n' \
            "${{ secrets.ANILIST_CLIENT_ID }}" "${{ secrets.ANILIST_CLIENT_SECRET }}" > src-tauri/.env

      - name: Install Anivexa deps
        run: npm install --prefix api/anivexa

      - name: Build sidecars
        run: npm run build:sidecars
        env:
          SKIP_ANIVEXA: ${{ matrix.platform == 'ubuntu-latest' && '1' || '0' }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KitaWatch ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false

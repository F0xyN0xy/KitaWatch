name: Status page deployment

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - ".github/workflows/status-page.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate status page JavaScript
        run: |
          node --check status-page/app.js
          node --check status-page/scripts/record-history.mjs

      - name: Record hourly status snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          STATUS_API_URL: https://kitawatch-status-api.onrender.com/api/status
        run: node status-page/scripts/record-history.mjs

      - name: Commit updated uptime history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- status-page/data/history.json; then
            echo "No new history changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status-page/data/history.json
            git commit -m "chore(status): record uptime history"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload status site
        uses: actions/upload-pages-artifact@v3
        with:
          path: status-page

      - name: Deploy status site
        id: deployment
        uses: actions/deploy-pages@v4

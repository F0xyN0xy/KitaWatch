name: Status page deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - ".github/workflows/status-page.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate status page JavaScript
        run: node --check status-page/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload status site
        uses: actions/upload-pages-artifact@v3
        with:
          path: status-page

      - name: Deploy status site
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy promo site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'

permissions:
  contents: read
  deployments: write          # NEW — allows creating deployment records

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip in forks without FTP secrets (prevents "username required" error)
    if: ${{ secrets.IF_FTP_USER != '' }}
    environment:
      name: infinityfree
      url: https://kitawatch.free.nf
    steps:
      - uses: actions/checkout@v4

      - name: Upload to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.IF_FTP_USER }}
          password: ${{ secrets.IF_FTP_PASS }}
          local-dir: ./site/
          server-dir: /htdocs/

      - name: Register deployment
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'infinityfree',
              auto_merge: false,
              required_contexts: [],
              description: 'Promo site -> InfinityFree (FTP)'
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'success',
              environment_url: 'https://kitawatch.free.nf'
            });
name: Status API checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "status-api/**"
      - "status-page/app.js"
      - ".github/workflows/status-api-check.yml"
  push:
    branches: [main]
    paths:
      - "status-api/**"
      - "status-page/app.js"
      - ".github/workflows/status-api-check.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check status API syntax
        run: npm run check --prefix status-api

      - name: Check status page syntax
        run: node --check status-page/app.js

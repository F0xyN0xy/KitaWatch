name: Backfill release notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Generate notes for releases with empty descriptions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GH_REPO;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com/${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers ?? {}) },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          const releases = await api(`repos/${repo}/releases?per_page=100`);
          const published = releases
            .filter((release) => !release.draft && !release.prerelease)
            .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

          let updated = 0;
          for (let index = 0; index < published.length; index += 1) {
            const release = published[index];
            if (release.body?.trim()) {
              console.log(`Skipping ${release.tag_name}: description already exists.`);
              continue;
            }

            const previous = published[index + 1];
            const generated = await api(`repos/${repo}/releases/generate-notes`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                tag_name: release.tag_name,
                ...(previous ? { previous_tag_name: previous.tag_name } : {}),
              }),
            });

            if (!generated.body?.trim()) {
              console.log(`Skipping ${release.tag_name}: GitHub generated no notes.`);
              continue;
            }

            await api(`repos/${repo}/releases/${release.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ body: generated.body }),
            });
            updated += 1;
            console.log(`Updated ${release.tag_name} using changes since ${previous?.tag_name ?? "the beginning"}.`);
          }

          console.log(`Finished. Updated ${updated} release description(s); existing descriptions were preserved.`);
          NODE

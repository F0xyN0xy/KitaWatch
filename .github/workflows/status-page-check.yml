name: Status page checks

on:
  pull_request:
    paths:
      - "status-page/**"
      - "status-api/**"
      - ".github/workflows/status-page*.yml"
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - "status-api/**"
      - ".github/workflows/status-page*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check status API syntax
        run: node --check status-api/server.mjs
      - name: Check page script syntax
        run: node --check status-page/app.js
      - name: Check history recorder syntax
        run: node --check status-page/scripts/record-history.mjs
      - name: Validate status JSON files
        run: |
          node -e "for (const file of ['status-page/data/status.json', 'status-page/data/history.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"

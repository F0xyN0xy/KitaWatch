name: Status page checks

on:
  pull_request:
    paths:
      - "status-page/**"
      - "status-api/**"
      - ".github/workflows/status-page*.yml"
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - "status-api/**"
      - ".github/workflows/status-page*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check status API syntax
        run: node --check status-api/server.mjs
      - name: Check page script syntax
        run: node --check status-page/app.js
      - name: Validate status data JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('status-page/data/status.json', 'utf8'))"

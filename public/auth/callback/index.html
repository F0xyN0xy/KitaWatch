<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Return to KitaWatch</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #09090f; color: #f4f4f5; }
    main { width: min(90vw, 440px); box-sizing: border-box; padding: 2rem; border: 1px solid #27272a; border-radius: 1.25rem; background: #111118; text-align: center; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #c4c4cc; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: .75rem; background: #7c3aed; color: white; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
    #status { min-height: 1.5em; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Return to KitaWatch</h1>
    <p id="message">Preparing your sign-in…</p>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="return-link" href="kitawatch://auth?provider=discord" hidden>Open KitaWatch</a>
  </main>
  <script>
    (() => {
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      const link = document.getElementById('return-link');
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');

      // Remove OAuth parameters from the visible address/history as soon as read.
      window.history.replaceState(null, '', window.location.pathname);

      if (error || !code) {
        message.textContent = 'Sign-in could not be completed.';
        status.textContent = 'Return to KitaWatch and try connecting Discord again.';
        return;
      }

      const callback = 'kitawatch://auth?provider=discord&code=' + encodeURIComponent(code);
      link.href = callback;
      link.hidden = false;
      message.textContent = 'Discord authorization is complete.';
      status.textContent = 'Opening KitaWatch… If it does not open, use the button below.';

      // Attempt the desktop handoff; the visible button remains as a fallback.
      window.location.href = callback;
    })();
  </script>
</body>
</html>
